services:
  leicraftmc-vault:
    image: ghcr.io/leicraftmc/vault:latest
    container_name: leicraftmc-vault
    restart: unless-stopped
    network_mode: bridge
    environment:
      DOMAIN: "https://vault.example.com"

      VB_S3_ENDPOINT: ""
      VB_S3_ACCESS_KEY_ID: ""
      VB_S3_SECRET_ACCESS_KEY: ""
      VB_S3_BUCKET: ""
      VB_S3_BASE_PATH: ""

      VB_AUTO_BACKUP: true

      VB_ENCRYPTION_PASSPHRASE: ""
    volumes:
      - /opt/leicraftmc/vault/data/:/data/
    ports:
      - 127.0.0.1:12322:80
