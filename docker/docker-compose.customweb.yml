services:
  leicraftmc-vault:
    image: ghcr.io/leicraftmc/vault:latest-customweb
    container_name: leicraftmc-vault
    restart: unless-stopped
    network_mode: bridge
    environment:
      DOMAIN: "https://vault.example.com"

      LCMC_VAULT_BACKUP_LOG_LEVEL: "info"

      LCMC_VAULT_BACKUP_S3_ENDPOINT: "api.s3.example.com"
      LCMC_VAULT_BACKUP_S3_ACCESS_KEY_ID: "my-access-key-id"
      LCMC_VAULT_BACKUP_S3_SECRET_ACCESS_KEY: "my-secret-access-key"
      LCMC_VAULT_BACKUP_S3_BUCKET: "lcmc-vault-backups"
      LCMC_VAULT_BACKUP_S3_BASE_PATH: ""

      LCMC_VAULT_BACKUP_NTFY_URL: "https://ntfy.example.com/my-topic"
      LCMC_VAULT_BACKUP_NTFY_AUTH_TOKEN: "my-ntfy-auth-token"

      LCMC_VAULT_BACKUP_AUTO_BACKUP: true

      LCMC_VAULT_BACKUP_ENCRYPTION_PASSPHRASE: "my-encryption-passphrase"
    volumes:
      - /opt/leicraftmc/vault/data/:/data/
    ports:
      - 127.0.0.1:12322:80
